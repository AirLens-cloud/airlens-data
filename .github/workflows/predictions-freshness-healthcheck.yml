name: Predictions Freshness Healthcheck

# 발행 워크플로가 멈추면 **빨간 줄조차 남지 않는다.**
#
# `ml-predict.yml`·`band-forecast.yml` 이 스케줄에서 밀리거나 비활성이 되면 run 이 실패하는 게 아니라
# *생성되지 않는다* — Actions 탭은 완벽히 조용하고, 마지막 성공 run 은 여전히 초록불이다.
#
# 그래서 감시를 발행 워크플로 **밖**에 둔다. 판정 대상은 run 이 아니라 HF 에 실제로 올라간 발행물
# (`grid_latest.json`, history 슬롯, 예측 밴드)이고, 거기에 발행 워크플로가 켜져 있는지(GitHub API 의
# `state`)를 더한다. 이 레포에 아직 없는 워크플로는 "미배포" 로만 적고 문제로 세지 않는다.
# 라이브 기능 probe 가 주(PRIMARY) 판정, 워크플로 상태는 보조 신호다.
#
# 경보 채널 = **GitHub 이슈 1건**. 매번 red 를 쏟거나 댓글을 쌓지 않는다 — 결손이 상시인 상태에서
# 그건 경보 피로로 직행한다. 대신 열린 이슈 하나의 **본문을 덮어써서** 항상 현재 상태를 들고 있게 하고,
# 복구되면 자동으로 닫는다.
#
# 탐지 지연(설계값): 발행이 멈춘 뒤 `grid_latest` 나이가 8h 를 넘는 시점(직전 발행 기준 최대 8h) → 다음 프로브까지
# 최대 2h. 앞단 8h 는 임계값 자체이므로 프로브 주기로는 줄일 수 없다. 2h 주기는 GitHub 스케줄 지연을 감안한
# 실효 프로브 간격보다 이미 촘촘하다 — 더 줄여도 탐지가 빨라지지 않고 Actions 분만 쓴다.
#
# 허용 나이 8h: 발행 주기는 3h 지만 GitHub 스케줄 지연으로 실제 발행 간격이 중앙값 5~6.5h(2주 실측)다. 4h 면 지연만으로
# 시간의 25~39% 동안 경보가 열리고, 8h 면 0~3% 다. 정시 호출이 ml 예측까지 오면 4h 로 되돌린다. 값은 세 곳(아래
# dispatch 기본값, 스케줄 run 의 대체값, 프로브 스크립트의 `DEFAULT_MAX_AGE_HOURS`)이 같아야 한다.
#
# 발행 워크플로를 일부러 끄는 작업(롤백 등)을 하면 `workflow_inactive` 경보가 켜진다. 그때는 아래
# `WATCHED_WORKFLOWS` 에서 그 파일을 같은 PR 에서 뺀다.

# 스케줄은 ml 컷오버 PR 에서 켰다(발행 :45 이 끝난 뒤, 2h 주기). 비공개 ML 레포의 같은 감시는 컷오버 때 끈다 —
# 둘 다 켜 두면 경보 이슈가 중복된다.
on:
  workflow_dispatch:
    inputs:
      max_age_hours:
        description: 'grid_latest.generated_at 허용 나이 (시간)'
        required: false
        default: '8'
      fail_on_stale:
        description: 'true = 신선도 이상도 job 을 red 로 (기본 false — 이슈가 경보 채널)'
        required: false
        default: 'false'
  schedule:
    - cron: '17 */2 * * *'

permissions:
  contents: read
  issues: write
  actions: read  # 발행 워크플로의 state 조회

concurrency:
  group: predictions-freshness
  cancel-in-progress: false

jobs:
  probe:
    name: Probe published predictions
    if: github.repository == 'AirLens-cloud/airlens-data'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # setup-python 은 일부러 생략한다 — 프로브는 표준 라이브러리만 쓰고(의존성 0),
      # ubuntu-latest 의 python3 로 충분하다. 2시간마다 도는 잡이라 설치 단계 하나가
      # 그대로 Actions 분으로 쌓인다.
      - name: Probe
        id: probe
        env:
          PREDICTIONS_MAX_AGE_HOURS: ${{ github.event.inputs.max_age_hours || '8' }}
          PREDICTIONS_CADENCE_HOURS: '3'   # 발행 주기 (ml-predict.yml 의 cron 과 맞춘다)
          BAND_MAX_AGE_HOURS: '12'         # 웹이 예측 밴드에 오래됨 배지를 다는 기준과 같은 값
          WATCHED_WORKFLOWS: 'ml-predict.yml,band-forecast.yml'
          PREDICTIONS_REPORT_PATH: ${{ runner.temp }}/predictions-freshness.md
          FAIL_ON_STALE: ${{ github.event.inputs.fail_on_stale || 'false' }}
          GH_TOKEN: ${{ github.token }}    # 워크플로 state 조회(actions: read)
        run: python3 scripts/etl/probe_predictions_freshness.py

      - name: Open, refresh, or close the alert issue
        # probe 가 probe_error 로 red 여도 이슈는 떠야 한다 — 경보 채널 자체의 고장은
        # 이슈로도 안 잡히므로 job red 와 이슈를 둘 다 남긴다.
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEALTHY: ${{ steps.probe.outputs.healthy }}
          TITLE: '예측 발행 신선도 경보 — ml-predict·예측 밴드'  # 조회와 생성이 같은 값을 쓴다
          REPORT: ${{ runner.temp }}/predictions-freshness.md
        run: |
          set -euo pipefail

          if [ ! -f "$REPORT" ]; then
            echo "::error::프로브가 리포트를 남기지 못했다 — 스크립트가 시작 전에 죽었다"
            exit 1
          fi

          # --search 대신 정확 일치로 고른다(검색 토크나이징에 제목을 맡기지 않는다). 작성자도 본다 — 공개 레포라 제3자가
          # 같은 제목으로 연 이슈를 이 워크플로가 덮어쓰거나 닫지 않게, github-actions 가 만든 이슈만 고른다. 서버 쪽
          # `--author`·`--app` 은 쓰지 않는다: 봇 표기가 맞지 않으면 조용히 0건이 되어 경보가 쌓인다(gh 2.102 에서
          # `--author app/github-actions` 가 봇이 만든 이슈에 0건이었다). 응답의 author.login 을 직접 보고, 봇 표기 차이
          # (`app/` 접두, `[bot]` 접미)는 떼고 비교한다.
          NUM=$(gh issue list --state open --limit 100 --json number,title,author \
                  --jq '[.[] | select(.title == env.TITLE and ((.author.login // "") | sub("^app/"; "") | sub("\\[bot\\]$"; "")) == "github-actions")] | .[0].number // ""')

          if [ "$HEALTHY" = "true" ]; then
            if [ -n "$NUM" ]; then
              gh issue close "$NUM" \
                --comment "✅ 발행 복구 확인 — 프로브가 정상 판정했다 ($(date -u +%Y-%m-%dT%H:%M:%SZ))."
              echo "이슈 #$NUM 닫음 (복구)"
            else
              echo "정상 — 열린 경보 이슈 없음"
            fi
            exit 0
          fi

          if [ -n "$NUM" ]; then
            # 댓글을 쌓지 않고 본문을 덮어쓴다 — 매번 알림이 오면 아무도 안 본다.
            gh issue edit "$NUM" --body-file "$REPORT"
            echo "이슈 #$NUM 본문 갱신"
          else
            gh issue create --title "$TITLE" --body-file "$REPORT"
            echo "경보 이슈 신규 생성"
          fi
