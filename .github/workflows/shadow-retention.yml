name: Shadow Retention (openaq-shadow / sensor-community-shadow)

# E2 사이드카(Oracle VM systemd 타이머)가 openaq-shadow/·sensor-community-shadow/ 로
# 매시 슬롯 파일을 발행하기만 하고(이 레포는 수집 안 함 — e2-shadow-freshness.yml
# 과 동일 경계), 삭제는 아무도 하지 않아 무한 누적 중이었다(hf_publish.py 의
# 옛 TS_NAME_RE가 pm25- 접두사·.json 확장자만 매치해 openaq-/sensor-community-
# 접두사 .json.gz 슬롯을 전혀 못 봤다 — DQSS W5 정규식 동기화로 해소, scripts/etl/
# hf_publish.py + scripts/etl/test_hf_publish.py 참조). 이 워크플로가 그 정리를 맡는다.
# backfill 산출물(openaq-backfill-kr-*)은 hf_publish.py 의 BACKFILL_MARKER 가드로
# 이 prune 이 몇 keep-days 를 넘겨도 항상 보존한다.

on:
  schedule:
    - cron: '40 2 * * *'  # 1일 1회, 다른 잡과 분단위로 분리
  workflow_dispatch:
    inputs:
      dry_run:
        description: '삭제 없이 대상 목록만 출력 (이 워크플로가 정리 경로를 처음 여는 PR — 머지 후 최초 1회는 수동으로 true 로 실행해 삭제 후보를 직접 확인 권장)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  prune-shadow:
    # fork PR 은 schedule/dispatch 를 트리거 못하지만, 베이스 repo 한정 명시(방어).
    if: github.repository == 'AirLens-cloud/airlens-data'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      # schedule 트리거에는 inputs 컨텍스트가 비어 있어 inputs.dry_run == true 는
      # 항상 false — 매 cron 실행이 조용히 dry-run 으로 새지 않는다.
      DRY_RUN_FLAG: ${{ inputs.dry_run == true && '--dry-run' || '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'

      # HF 쓰기 토큰이 있는 잡 — 해시 고정본만 깐다(scripts/etl/test_publish_install_lock.py 가 지킨다).
      - name: Install huggingface_hub (hash-locked)
        run: |
          python3 -m pip install --no-cache-dir --require-hashes --no-deps --only-binary :all: \
            -r scripts/etl/requirements-publish.lock.txt
          python3 -m pip check

      - name: Prune stale openaq-shadow slots (>14d)
        run: python3 scripts/etl/hf_publish.py prune --prefix openaq-shadow --keep-days 14 ${DRY_RUN_FLAG:+"$DRY_RUN_FLAG"}

      - name: Prune stale sensor-community-shadow slots (>14d)
        run: python3 scripts/etl/hf_publish.py prune --prefix sensor-community-shadow --keep-days 14 ${DRY_RUN_FLAG:+"$DRY_RUN_FLAG"}
