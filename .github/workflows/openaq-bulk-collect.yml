name: OpenAQ Bulk Collect (manual)

# 모노레포 insights 파이프라인 입력 `Data/3-raw-sources/air_quality/openaq/` 가
# 152일간 로컬 수동 실행 의존으로 방치돼 있던 것을 클라우드화한다(2a). 관측소별
# `/latest` 순회(9시간급)가 아니라 파라미터별 벌크 페이지네이션으로 수집한다 —
# 상세 설계는 scripts/etl/collect_openaq_bulk.py 모듈 docstring 참조.
#
# 스케줄 = 매일 01:45 UTC. 수동 검증 사이클은 2026-09-06 에 끝났다(run
# 34003328321 KR 569행 / 34003842361 전역 149개국 14,753행, 둘 다 62 req).
#
# **왜 :45 인가 — 이 키의 소비자는 하나가 아니다.** e2-sidecar `openaq_shadow`
# 가 매시 :15 에 ~120 req(1,200ms 간격 = 50/분)를 같은 `OPENAQ_API_KEY` 로
# 쓴다. 이 수집기는 55/분으로 페이싱하므로 둘이 겹치면 105/분 이 되어 OpenAQ
# 무료 한도 60/분 을 넘는다(2,000/시간 쪽은 합쳐도 ~182 로 여유). 반복 초과는
# "일시적 또는 영구적 차단"이다(docs.openaq.org/using-the-api/rate-limits).
# :45 는 사이드카 창에서 30분 떨어져 있고 이 레포의 다른 cron 분(:05 :15 :20
# :25 :35 :40 :50)과도 겹치지 않는다. 시각 오프셋만으로는 세 번째 소비자가
# 생기면 다시 깨지므로, 수집기 자체가 응답의 `x-ratelimit-remaining` 을 읽고
# 잔여가 예비분 이하면 창 리셋까지 쉰다(collect_openaq_bulk.RateLimiter.observe).
#
# **왜 일간인가.** 산출물 파일명이 날짜 태그다(`openaq_{CC}_multi_{YYYYMMDD}.csv`)
# — 하루에 여러 번 돌면 같은 파일을 덮어쓸 뿐이다. 모노레포 pull 스텝(소비 경로)
# 은 아직 없다. 그래도 켜는 이유는 F7 입력 기아를 끝내려면 일별 스냅샷이 실제로
# 쌓여 있어야 하기 때문이고, 비용은 하루 62 요청이다.
#
# 발행 대상 (HF Robeedau/airlens-live):
#   insights-data/openaq-bulk/{YYYY-MM}/openaq_{CC}_multi_{YYYYMMDD}.csv
#   insights-data/openaq-bulk/manifest.json  (항목 `path` = prefix 기준 상대 경로)
# 월 폴더는 HF 의 폴더당 파일 1만 개 상한 때문이다(하루 ~149개국). 2026-10-10
# 이전 파일 5,082개는 prefix 바로 아래에 그대로 남아 있다.

on:
  schedule:
    - cron: '45 1 * * *'  # 매일 01:45 UTC — 근거는 위 §스케줄 주석
  workflow_dispatch:
    inputs:
      countries:
        description: '쉼표구분 ISO country code 필터 (비우면 전체 국가)'
        required: false
        default: ''

permissions:
  contents: read

# 수동 트리거가 cron 실행과 겹치면 같은 키로 2배 속도가 난다 — 직렬화한다.
# cancel-in-progress 는 쓰지 않는다(진행 중 수집을 죽이면 부분 발행이 남는다).
concurrency:
  group: openaq-bulk-collect
  cancel-in-progress: false

jobs:
  collect-openaq-bulk:
    if: github.repository == 'AirLens-cloud/airlens-data'
    runs-on: ubuntu-latest
    # HF 쓰기 토큰은 environment `hf-write` 의 secret 이다(보호 조건은 README 「Secrets」)
    environment:
      name: hf-write
      deployment: false
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'

      # HF 쓰기 토큰이 있는 잡 — 해시 고정본만 깐다(scripts/etl/test_publish_install_lock.py 가 지킨다).
      - name: Install huggingface_hub (hash-locked)
        run: |
          python3 -m pip install --no-cache-dir --require-hashes --no-deps --only-binary :all: \
            -r scripts/etl/requirements-publish.lock.txt
          python3 -m pip check

      # 신규 pip dep 0(stdlib urllib only) — 수집기 본문은 scripts/etl/collect_openaq_bulk.py,
      # 시험은 scripts/etl/test_collect_openaq_bulk.py(CI: pr-check etl-tests). OPENAQ_API_KEY
      # 미등록이어도 워크플로는 성공 종료한다(수집기가 graceful skip, exit 0) — 키
      # 등록이 이 파이프라인의 payoff 트리거.
      - name: Collect OpenAQ bulk snapshot
        id: collect
        env:
          OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
          COUNTRIES: ${{ inputs.countries }}
        run: |
          mkdir -p openaq-bulk-out
          python3 scripts/etl/collect_openaq_bulk.py \
            --out openaq-bulk-out \
            ${COUNTRIES:+--countries "$COUNTRIES"}

      - name: Upload to HF (insights-data/openaq-bulk, fail-loud)
        run: |
          if [ -z "$(ls -A openaq-bulk-out 2>/dev/null)" ]; then
            echo "발행할 산출물이 없다 (OPENAQ_API_KEY 미등록 등 graceful skip) — 업로드 생략"
            exit 0
          fi
          python3 scripts/etl/hf_publish.py upload \
            --src openaq-bulk-out --dest insights-data/openaq-bulk \
            || { echo "::error title=HF upload failed::insights-data/openaq-bulk — 옛 버전이 그대로 발행된다"; exit 1; }
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

      - name: Summary
        if: always()
        run: |
          echo "## OpenAQ Bulk Collect Result" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Ran at: $(date -u '+%Y-%m-%d %H:%M UTC')" >> "$GITHUB_STEP_SUMMARY"
          if [ -f openaq-bulk-out/manifest.json ]; then
            # heredoc 관용구 — 파이썬 본문을 블록 스칼라 기준선(이 파일에선 10칸)에
            # 맞춰 들여쓴다. YAML 이 그 들여쓰기를 벗겨 셸에는 컬럼 0 으로 도달하고,
            # 인용부호 이스케이프도 필요 없다. 컬럼 0 에서 시작하면 블록 스칼라가
            # 거기서 끝나 워크플로 전체가 파싱 불가가 된다(이 스텝의 원래 형태).
            python3 - >> "$GITHUB_STEP_SUMMARY" <<'SCRIPT'
          import json
          m = json.load(open("openaq-bulk-out/manifest.json"))
          total = sum(f["rows"] for f in m["files"])
          print(f"Files: {len(m['files'])}, total rows: {total}")
          for f in m["files"]:
              print(f"  - {f['name']}: {f['rows']} rows, {f['bytes']:,} bytes")
          SCRIPT
          else
            echo "No manifest produced (OPENAQ_API_KEY not registered — graceful skip)." >> "$GITHUB_STEP_SUMMARY"
          fi
