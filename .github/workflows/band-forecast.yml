name: Band Forecast → HF

# 예측 밴드(TimesFM + conformal, `w3-band-v1`)를 예보 수집 직후에 만들어 HF 에 발행한다. 추론 코드는 비공개 ML 레포가
# 만든 `airlens-inference` wheel 로 들어오고, 이 레포는 그것을 받아 실행만 한다(소스를 복사하지 않는다).
# 구조와 가드는 ml-predict.yml 과 같다(infer / publish 두 잡). 아래는 band 에서 다른 점만 적는다.
#
# ── 발행 모드 (`PUBLISH_MODE`) ──────────────────────────────────────────────────
#   candidate   `aq-data/_candidate/forecast-band/` 아래 타임스탬프 파일만 쓴다. 운영 경로는 건드리지 않는다.
#               운영 band 는 latest 하나만 덮어써서 이력이 없다. 그래서 같은 발행 잡이 그 시점의 운영 latest 사본도
#               `prod/` 아래에 남긴다(같은 issue 의 사본이 이미 있으면 남기지 않는다). 같은 STAMP 끼리
#               `scripts/ml/compare_candidate.py --product band` 로 비교한다.
#               사본은 이 후보 발행 잡에서만 남기고(운영 모드는 남기지 않는다), 짝은 보통 한 주기 늦게 생긴다. 후보 run 이
#               도는 시점의 운영 latest 는 그 run 의 예보 발행을 아직 반영하지 않았을 수 있고, 다음 예보 발행의 후보 run 이
#               그 사이의 운영 latest 를 잡아야 짝이 만들어진다. 운영이 그 주기에 돌지 않으면 그 STAMP 는 UNPAIRED 로 남는다.
#   production  `aq-data/forecast-band/latest.json` 을 덮어쓴다.
# 컷오버 = 아래 env 의 이 줄 하나를 바꾸는 PR(main 에 머지된 값만 쓰인다). dispatch 입력으로 받지 않는다. 경로 매핑은
# `scripts/ml/publish_targets.py` 가 한 곳에서 정한다.
#
# ── 트리거 ──────────────────────────────────────────────────────────────────────
#   workflow_run       예보 수집(forecast-collect.yml)이 main 에서 성공한 직후 — 입력이 방금 갱신됐다. 이 형태의
#                      workflow_run 만 허용한다(이름·types·branches 고정). 예보 수집은 PR 트리거가 없어서 PR 코드가
#                      이 워크플로를 돌릴 수 없다. 둘 다 test_ml_workflow_safety.py 가 지킨다.
#   schedule           백업. 예보 수집이 15분에 시작하는 6시간 주기 뒤인 50분. 스케줄은 늦을 수 있어서 이 경로만으로는
#                      밴드가 오래된다.
#   workflow_dispatch  `force` 만 받는다.
# 같은 예보 발행을 두 번 돌리지 않는다. `scripts/ml/band_guard.py` 가 이미 처리한 발행이면 건너뛰게 하고(`force` 면
# 건너뛰지 않는다), 판정을 못 하면 경고만 남기고 돌린다. 건너뛴 run 의 발행 잡은 돌지 않는다.
#
# ── 설치 ────────────────────────────────────────────────────────────────────────
# 세 단계다. wheel 의 기본 의존성(xgboost 등)은 band 에 필요 없어서 깔지 않는다 — xgboost 가 CUDA 계열 패키지를 끌어온다.
#   ① CPU torch 만 PyTorch CPU 인덱스에서(`requirements-band-torch.lock.txt`, 해시 고정)
#   ② 추론 wheel `--no-deps` (받을 때 sha256 핀으로 검증)
#   ③ `[band]` extra 의 나머지 폐포를 PyPI 에서(`requirements-band.lock.txt`, 해시 고정)
# 그다음 `scripts/ml/check_band_env.py` 가 설치 결과를 검사한다 — GPU 스택 없음, CPU 빌드 torch, 그리고 `pip check`
# 가 낸 줄의 집합이 기대 목록(`BAND_SKIPPED_BASE_DEPS`, 일부러 깔지 않은 기본 의존성마다 한 줄)과 정확히 같은지. 기대한
# 줄이 없거나 다른 줄이 있거나 출력이 비었거나 `No broken requirements found.` 면 실패다.
#
# ── 공개 레포라서 ───────────────────────────────────────────────────────────────
# · 시크릿은 쓰는 스텝의 env 에만. 두 잡은 main 에서만 돈다(`github.ref` 가드).
# · wheel·venv·pip·모델 캐시를 어떤 캐시에도 넣지 않는다(actions/cache 도 쓰지 않아 모든 run 이 콜드다).
#   artifact 에는 발행 페이로드 JSON 한 파일만 올린다.
# · 실패해도 비공개 코드 줄이 로그에 남지 않게 모든 airlens-* 명령은 `scripts/ml/run_entry.py` 로 돌린다.
# · 이 워크플로에서 `HF_LIVE_REPO` 를 설정하지 않는다(발행·관측 읽기의 대상 저장소가 함께 바뀐다).
# · 경로 플래그를 전부 명시한다 — 빠진 플래그의 기본 경로에 기대지 않는다. `--issues-limit` 은 쓰지 않는다.
#
# wheel 은 버전 + sha256 핀으로 받는다. 배포 = 아래 두 핀을 바꾸는 PR(ml-predict.yml 과 같은 wheel 이라 함께 고친다).
# wheel 핀을 올릴 때 함께 점검한다: ml-predict.yml 과 이 파일의 핀, 아래 `BAND_SKIPPED_BASE_DEPS`, `test_ml_workflow_safety.py` 의
# `PIP_EXPECTED_MISSING`, `test_check_band_env.py` 의 VERSION, band 고정본(`constraints-band.txt` 와 lock 두 개).
# 컷오버 조건의 시간 기준: infer 잡 시간(run 의 잡 기록)이 35분 미만인 run 이 3회 이상이다.
# 가드: `scripts/ml/test_ml_workflow_safety.py`.

on:
  workflow_run:
    workflows: ["Forecast Collection (Open-Meteo CAMS PM2.5)"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '50 */6 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '이미 처리한 예보 발행이어도 다시 돌린다 (기본: 건너뜀)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: band-forecast
  cancel-in-progress: false

env:
  PUBLISH_MODE: candidate  # candidate | production — 컷오버는 이 줄을 바꾸는 PR
  INFERENCE_VERSION: '0.3.0'  # wheel 버전 핀
  INFERENCE_WHEEL_SHA256: '63eed042320a0ddfe69c695c74b1ebb4cf80b90966e976dbb76728c430910a3c'  # 위 버전 wheel 의 sha256 핀
  BAND_SKIPPED_BASE_DEPS: 'joblib,lightgbm,python-dotenv,scikit-learn,scipy,xgboost'  # wheel 기본 의존성 중 일부러 깔지 않는 것(pip check 가 정확히 이 줄들만 낸다)

defaults:
  run:
    shell: bash

jobs:
  infer:
    name: Infer (wheel, no write token)
    if: github.repository == 'AirLens-cloud/airlens-data' && github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      skip: ${{ steps.guard.outputs.skip }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'  # numpy 2.5.1 이 3.12 이상을 요구한다 (constraints-band.txt 참조)

      # 공개 URL 만 읽는다(토큰 없음). 이 스텝 뒤의 모든 infer 스텝과 발행 잡은 skip 출력을 따른다.
      - name: Skip if this forecast issue is already handled
        id: guard
        env:
          FORCE: ${{ inputs.force || false }}
        run: |
          set -euo pipefail
          python3 scripts/ml/band_guard.py check --mode "$PUBLISH_MODE" --force "$FORCE"

      - name: Prepare directories
        if: steps.guard.outputs.skip != 'true'
        run: |
          set -euo pipefail
          {
            echo "WORK=$RUNNER_TEMP/work"
            echo "VENV=$RUNNER_TEMP/venv"
            echo "WHEEL_DIR=$RUNNER_TEMP/wheel"
            echo "STAGE=$RUNNER_TEMP/stage"
            echo "CACHE_DIR=$RUNNER_TEMP/work/cache"
            echo "OUT_DIR=$RUNNER_TEMP/work/out"
          } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/work/cache" "$RUNNER_TEMP/work/out" "$RUNNER_TEMP/stage"

      # 읽기 전용 토큰과 저장소 id 는 이 스텝에만 있다. 토큰은 같은 origin(허브 안) 리다이렉트에만 따라가고 CDN 에는 가지 않는다.
      - name: Fetch inference wheel (pinned, sha256 verified)
        if: steps.guard.outputs.skip != 'true'
        id: wheel
        env:
          HF_MODELS_READ: ${{ secrets.HF_MODELS_READ }}
          HF_MODELS_REPO: ${{ secrets.HF_MODELS_REPO }}
        run: |
          set -euo pipefail
          python3 scripts/ml/fetch_inference_wheel.py \
            --version "$INFERENCE_VERSION" --sha256 "$INFERENCE_WHEEL_SHA256" --dest "$WHEEL_DIR"

      # CPU torch 만 PyTorch CPU 인덱스에서 받는다. `--index-url` 은 이 스텝에만 있다(다른 설치는 PyPI).
      - name: Install CPU torch (hash-locked)
        if: steps.guard.outputs.skip != 'true'
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: '1'
        run: |
          set -euo pipefail
          python3 -m venv "$VENV"
          "$VENV/bin/python" -m pip install --no-cache-dir --require-hashes --no-deps --only-binary :all: \
            --index-url https://download.pytorch.org/whl/cpu -r scripts/ml/requirements-band-torch.lock.txt

      - name: Install inference wheel (no deps)
        if: steps.guard.outputs.skip != 'true'
        env:
          WHEEL: ${{ steps.wheel.outputs.wheel }}
          PIP_DISABLE_PIP_VERSION_CHECK: '1'
        run: |
          set -euo pipefail
          "$VENV/bin/python" -m pip install --no-cache-dir --no-deps "$WHEEL"

      - name: Install band dependencies (hash-locked)
        if: steps.guard.outputs.skip != 'true'
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: '1'
        run: |
          set -euo pipefail
          "$VENV/bin/python" -m pip install --no-cache-dir --require-hashes --no-deps --only-binary :all: \
            -r scripts/ml/requirements-band.lock.txt

      # `pip check` 는 일부러 깔지 않은 기본 의존성마다 한 줄을 낸다. 종료 코드는 그 줄 때문에 늘 실패라 삼키고(`|| true`), 출력이
      # 기대한 줄과 정확히 같을 때만 통과시킨다(기대한 줄이 없거나, 다른 줄이 있거나, 빈 출력이거나, 문제 없음 메시지면 실패).
      # 같은 스텝에서 GPU 스택(nvidia-*, cuda-*, triton)이 없는지, torch 가 CPU 빌드인지(`torch.version.cuda` 가 None)
      # 도 본다. 설치가 끝난 뒤, 추론을 돌리기 전이다. `pip list` 는 끝에 pip 새 버전을 확인하러 PyPI 에 나가므로(`pip check` 는
      # 아니다) 다른 pip 스텝처럼 그 확인을 끈다.
      - name: Verify installed environment (CPU only)
        if: steps.guard.outputs.skip != 'true'
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: '1'
        run: |
          set -euo pipefail
          "$VENV/bin/python" -m pip list --format=freeze | tee "$WORK/pip-list.txt"
          "$VENV/bin/python" -m pip check > "$WORK/pip-check.txt" 2>&1 || true
          cat "$WORK/pip-check.txt"
          TORCH_CUDA=$("$VENV/bin/python" -I -c 'import torch; print(torch.version.cuda)')
          python3 scripts/ml/check_band_env.py \
            --pip-check "$WORK/pip-check.txt" --pip-list "$WORK/pip-list.txt" --torch-cuda "$TORCH_CUDA" \
            --project airlens-inference --version "$INFERENCE_VERSION" --expect-missing "$BAND_SKIPPED_BASE_DEPS"

      # 신선 관측 시계열을 만든다(공개 HF 의 OpenAQ 슬롯). 경로 플래그를 전부 명시한다.
      - name: Build fresh OpenAQ series
        if: steps.guard.outputs.skip != 'true'
        run: |
          set -euo pipefail
          cd "$WORK"
          "$VENV/bin/python" -I -u "$GITHUB_WORKSPACE/scripts/ml/run_entry.py" \
            airlens-band-fresh-openaq --cache-dir "$CACHE_DIR" --out-dir "$OUT_DIR"

      # TimesFM 밴드 엔진 + conformal. 가장 오래 걸리는 스텝이다(모델 가중치는 공개 HF 에서 토큰 없이 받는다).
      # `--issues-limit` 은 스모크 전용이라 쓰지 않는다.
      - name: Run band engine
        if: steps.guard.outputs.skip != 'true'
        run: |
          set -euo pipefail
          cd "$WORK"
          "$VENV/bin/python" -I -u "$GITHUB_WORKSPACE/scripts/ml/run_entry.py" \
            airlens-band-engine \
            --series-path "$OUT_DIR/fresh_openaq_series.parquet" --cities-path "$OUT_DIR/fresh_openaq_cities.parquet" \
            --cache-dir "$CACHE_DIR" --out-dir "$OUT_DIR"

      # 발행 페이로드(w3-band-v1)를 STAGE 에 바로 쓴다. 보정 리포트는 --out-dir 에 있어서 따로 넘기지 않는다.
      - name: Assemble band payload
        if: steps.guard.outputs.skip != 'true'
        run: |
          set -euo pipefail
          cd "$WORK"
          "$VENV/bin/python" -I -u "$GITHUB_WORKSPACE/scripts/ml/run_entry.py" \
            airlens-band-publish \
            --band-predictions-path "$OUT_DIR/band_predictions.parquet" --out "$STAGE/forecast_band_latest.json"
          ls -l "$STAGE"

      # 발행 잡으로 넘기는 것은 발행 페이로드 JSON 한 파일뿐이다. 폴더가 아니라 그 파일을 가리켜서, 진입점이 `--out` 옆에
      # 다른 파일을 써도 공개 artifact 로 나가지 않는다. 파일이 없으면 `if-no-files-found: error` 로 run 이 실패한다.
      - name: Upload JSON outputs
        if: steps.guard.outputs.skip != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: band-forecast-output
          path: ${{ runner.temp }}/stage/forecast_band_latest.json
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Publish to HF (no wheel)
    needs: infer
    if: needs.infer.outputs.skip != 'true' && github.repository == 'AirLens-cloud/airlens-data' && github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # 발행기(hf_publish.py)와 계약 검증기(contracts/)가 체크아웃에 있다. wheel 은 이 잡에 없다.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'

      # 이 잡은 HF 쓰기 토큰을 받는 스텝이 있다. 발행기 의존성은 해시까지 고정하고 sdist 빌드를 막는다.
      - name: Install pinned huggingface_hub (hash-locked)
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: '1'
        run: |
          set -euo pipefail
          python3 -m pip install --no-cache-dir --require-hashes --no-deps --only-binary :all: \
            -r scripts/etl/requirements-publish.lock.txt
          python3 -m pip check

      - name: Download JSON outputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: band-forecast-output
          path: ${{ runner.temp }}/pub

      # 후보 모드에서만 받는다(운영 모드는 아무것도 하지 않는다). 공개 URL 읽기라 토큰이 없다. 받지 못하거나 모양·계약이
      # 틀리면 사본을 남기지 않는다 — 스텝은 성공으로 끝나고, 이번 STAMP 는 비교 짝이 만들어지지 않을 뿐이다. 계약 검증은
      # 아래 발행기의 `--schema auto` 와 같은 검증기다(계약을 어긴 사본이 후보 발행까지 멈추게 하지 않으려고 먼저 거른다).
      - name: Snapshot production latest (candidate only)
        run: |
          set -euo pipefail
          python3 scripts/ml/band_guard.py snapshot --mode "$PUBLISH_MODE" --dest "$RUNNER_TEMP/prod/prod_latest.json"

      # 계약 검증(`--schema auto`)은 원격 호출 전에 끝난다 — 위반이면 아무것도 올라가지 않는다. 후보 모드의 발행물과
      # 운영 사본은 한 번의 batch(한 커밋)로 올라간다.
      - name: Publish band
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          PUB="$RUNNER_TEMP/pub"
          echo "publish mode=$PUBLISH_MODE"
          OUT=$(python3 scripts/ml/publish_targets.py maps --mode "$PUBLISH_MODE" --dir "$PUB" --group band \
            --prod-snapshot "$RUNNER_TEMP/prod/prod_latest.json")
          ARGS=()
          while IFS= read -r m; do ARGS+=(--map "$m"); done <<< "$OUT"
          python3 scripts/etl/hf_publish.py batch "${ARGS[@]}" --schema auto \
            || { echo "::error::HF band publish failed"; exit 1; }
